<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00f0ff">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AINEXTGENZ - Next Gen AI</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #050505; color: #fff; overflow: hidden; height: 100vh; position: relative; }
        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .app-wrapper { display: flex; width: 100vw; height: 100vh; position: relative; z-index: 2; }

        .sidebar { width: 280px; background: rgba(5, 5, 15, 0.85); backdrop-filter: blur(10px); border-right: 1px solid rgba(0, 243, 255, 0.2); padding: 20px; display: flex; flex-direction: column; gap: 15px; transition: 0.3s; }
        .sidebar-title { font-size: 1.1rem; font-weight: bold; color: #00f3ff; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid rgba(0, 243, 255, 0.2); padding-bottom: 10px; text-shadow: 0 0 5px #00f3ff; }
        .btn-new-chat { width: 100%; padding: 10px; background: rgba(189, 0, 255, 0.1); border: 1px dashed #bd00ff; border-radius: 5px; color: #fff; cursor: pointer; text-align: center; font-size: 0.9rem; transition: 0.3s; }
        .btn-new-chat:hover { background: #bd00ff; color: #000; box-shadow: 0 0 15px #bd00ff; }
        
        .history-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: rgba(189, 0, 255, 0.4); border-radius: 10px; }
        .history-item { padding: 12px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 5px; font-size: 0.9rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: 0.2s; }
        .history-item:hover { background: rgba(0, 243, 255, 0.1); border-color: #00f3ff; color: #00f3ff; padding-left: 15px; }

        .main-content { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .ai-container { background: rgba(10, 10, 20, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 20px; padding: 30px; width: 100%; max-width: 750px; box-shadow: 0 0 40px rgba(0, 243, 255, 0.2); display: flex; flex-direction: column; max-height: 95vh; }
        
        .title { text-align: center; font-size: 2.3rem; font-weight: bold; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 5px; text-shadow: 0 0 10px #00f3ff, 0 0 40px #bd00ff; animation: glitch 2s infinite; }
        .subtitle { text-align: center; color: #00f3ff; font-size: 0.9rem; margin-bottom: 15px; letter-spacing: 2px; }

        .chat-area { flex-grow: 1; min-height: 300px; max-height: 450px; overflow-y: auto; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(189, 0, 255, 0.3); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; }
        .chat-area::-webkit-scrollbar { width: 6px; }
        .chat-area::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .chat-area::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.4); border-radius: 10px; }

        .bubble { max-width: 80%; padding: 12px 18px; border-radius: 15px; font-size: 1.1rem; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.3s ease-out forwards; }
        .bubble.user { align-self: flex-end; background: rgba(0, 243, 255, 0.15); border: 1px solid #00f3ff; border-bottom-right-radius: 2px; color: #fff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.1); }
        .bubble.ai { align-self: flex-start; background: rgba(189, 0, 255, 0.15); border: 1px solid #bd00ff; border-bottom-left-radius: 2px; color: #e0e0e0; box-shadow: 0 0 15px rgba(189, 0, 255, 0.1); }

        .input-group { display: flex; gap: 10px; }
        .input-box { flex-grow: 1; padding: 15px; background: rgba(0, 0, 0, 0.5); border: 1px solid #bd00ff; border-radius: 10px; color: #00f3ff; font-size: 1.1rem; outline: none; }
        .input-box:focus { box-shadow: 0 0 20px rgba(189, 0, 255, 0.5); border-color: #00f3ff; }
        .btn-generate { padding: 0 25px; background: transparent; color: #00f3ff; font-size: 1.1rem; font-weight: bold; text-transform: uppercase; border: 2px solid #00f3ff; border-radius: 10px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
        .btn-generate:hover:not(:disabled) { background: #00f3ff; color: #000; box-shadow: 0 0 30px #00f3ff; transform: scale(1.05); }
        .btn-generate:disabled { border-color: #555; color: #555; cursor: not-allowed; box-shadow: none; }
        
        .auth-container { display: flex; justify-content: center; margin-bottom: 15px; }
        .user-profile { display: none; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid rgba(0, 243, 255, 0.2); }
        .user-info { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #00f3ff; }
        .btn-logout { background: transparent; color: #ff0055; border: 1px solid #ff0055; padding: 4px 8px; border-radius: 5px; cursor: pointer; font-size: 0.75rem; }
        .hidden { display: none !important; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes glitch { 0%, 100% { text-shadow: 2px 0 #00f3ff, -2px 0 #bd00ff; } 50% { text-shadow: -2px 0 #00f3ff, 2px 0 #bd00ff; } }

        /* PENGATURAN RESPONSIVE UNTUK HP (MOBILE) */
        @media (max-width: 768px) {
            .app-wrapper {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: 130px; 
                border-right: none;
                border-bottom: 1px solid rgba(0, 243, 255, 0.2);
                padding: 10px;
            }
            
            .main-content {
                padding: 10px;
                height: calc(100vh - 130px);
            }
            
            .ai-container {
                padding: 15px;
                width: 100%;
                height: 100%;
                max-height: 100%;
                border-radius: 15px;
            }
            
            .title {
                font-size: 1.5rem;
                letter-spacing: 2px;
            }
            
            .subtitle {
                font-size: 0.8rem;
                margin-bottom: 10px;
            }
            
            .chat-area {
                padding: 15px 10px;
                max-height: none; 
            }
            
            .bubble {
                max-width: 95%; 
                font-size: 0.95rem;
                padding: 10px 15px;
            }
            
            .input-group {
                gap: 5px;
            }
            
            .input-box {
                padding: 12px;
                font-size: 0.95rem;
            }
            
            .btn-generate {
                padding: 0 15px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <div class="app-wrapper">
        <div class="sidebar">
            <div class="sidebar-title">Riwayat Search</div>
            <button class="btn-new-chat" onclick="clearChat()">+ Sesi Baru</button>
            <div class="history-list" id="history-box"></div>
        </div>
        <div class="main-content">
            <div class="ai-container">
                <h1 class="title">AINEXTGENZ</h1>
                <p class="subtitle">Neural Network System Online</p>
                
                <div class="auth-container" id="login-area">
                    <div id="g_id_onload" data-client_id="1098689643267-hrlj7u8ciq302s795620b7cuqnf8vev2.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
                    <div class="g_id_signin" data-type="standard" data-theme="dark" data-size="large"></div>
                </div>

                <div class="user-profile" id="user-area">
                    <div class="user-info">
                        <img src="" id="user-img" class="user-avatar" alt="Avatar">
                        <span id="user-name">User</span>
                    </div>
                    <button class="btn-logout" onclick="logout()">Disconnect</button>
                </div>
                
                <div class="chat-area" id="chat-box">
                    <div class="bubble ai" id="welcome-msg" style="display: none;">System Online. Riwayat pencarian aktif di sidebar.</div>
                </div>

                <div class="input-group">
                    <input type="text" id="ai-input" class="input-box" placeholder="Silahkan login dahulu..." disabled onkeypress="handleEnter(event)">
                    <button class="btn-generate" id="btn-submit" onclick="generateAI()" disabled>Kirim</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let userToken = null;
        let chatHistory = [];
        let searchHistoryList = JSON.parse(localStorage.getItem('fanaigenz_history')) || []; 
        
        window.onload = function() { renderSidebar(); };

        function handleCredentialResponse(response) {
            try {
                userToken = response.credential;
                const base64Url = userToken.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                const payload = JSON.parse(jsonPayload);

                document.getElementById('user-img').src = payload.picture;
                document.getElementById('user-name').innerText = payload.name;
                document.getElementById('login-area').classList.add('hidden');
                document.getElementById('user-area').style.display = 'flex';
                
                document.getElementById('ai-input').disabled = false;
                document.getElementById('ai-input').placeholder = "Ketik perintah di sini... (Enter untuk kirim)";
                document.getElementById('btn-submit').disabled = false;
                document.getElementById('welcome-msg').style.display = 'block';
                document.getElementById('ai-input').focus();
            } catch (error) {
                userToken = response.credential;
                document.getElementById('login-area').classList.add('hidden');
                document.getElementById('ai-input').disabled = false;
                document.getElementById('ai-input').placeholder = "Terkoneksi. Ketik perintah di sini...";
                document.getElementById('btn-submit').disabled = false;
                document.getElementById('welcome-msg').style.display = 'block';
                document.getElementById('ai-input').focus();
            }
        }

        function logout() {
            userToken = null; clearChat();
            document.getElementById('login-area').classList.remove('hidden');
            document.getElementById('user-area').style.display = 'none';
            document.getElementById('ai-input').disabled = true;
            document.getElementById('ai-input').value = '';
            document.getElementById('ai-input').placeholder = "Silahkan login dahulu...";
            document.getElementById('btn-submit').disabled = true;
        }

        function handleEnter(event) { if (event.key === "Enter") generateAI(); }

        function clearChat() {
            chatHistory = [];
            document.getElementById('chat-box').innerHTML = '<div class="bubble ai" id="welcome-msg">System Online. Riwayat pencarian aktif di sidebar.</div>';
            document.getElementById('ai-input').focus();
        }

        function renderSidebar() {
            const historyBox =
