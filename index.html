<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FANAIgenz - Next Gen AI</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        /* --- KODE CSS LAMA TETAP DIPERTAHANKAN --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #050505; color: #fff; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #particle-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .ai-container { position: relative; z-index: 2; background: rgba(10, 10, 20, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 20px; padding: 40px; width: 90%; max-width: 600px; box-shadow: 0 0 40px rgba(0, 243, 255, 0.2); animation: float 6s ease-in-out infinite; }
        .title { text-align: center; font-size: 3rem; font-weight: bold; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 5px; position: relative; text-shadow: 0 0 10px #00f3ff, 0 0 40px #bd00ff; animation: glitch 2s infinite; }
        .subtitle { text-align: center; color: #00f3ff; font-size: 1rem; margin-bottom: 20px; letter-spacing: 2px; }
        .input-box { width: 100%; padding: 15px; background: rgba(0, 0, 0, 0.5); border: 1px solid #bd00ff; border-radius: 10px; color: #00f3ff; font-size: 1.1rem; outline: none; }
        .input-box:focus { box-shadow: 0 0 20px rgba(189, 0, 255, 0.5); border-color: #00f3ff; }
        .btn-generate { width: 100%; margin-top: 20px; padding: 15px; background: transparent; color: #00f3ff; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; border: 2px solid #00f3ff; border-radius: 10px; cursor: pointer; transition: 0.3s; box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
        .btn-generate:hover { background: #00f3ff; color: #000; box-shadow: 0 0 30px #00f3ff; transform: scale(1.02); }
        .response-box { margin-top: 30px; min-height: 100px; padding: 15px; border-left: 4px solid #bd00ff; background: rgba(189, 0, 255, 0.1); color: #ddd; display: none; font-size: 1rem; line-height: 1.5; max-height: 200px; overflow-y: auto; }
        
        /* --- CSS BARU UNTUK LOGIN & UTILITY --- */
        .auth-container { display: flex; justify-content: center; margin-bottom: 20px; }
        .user-profile { display: none; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid rgba(0, 243, 255, 0.2); }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #00f3ff; }
        .btn-logout { background: transparent; color: #ff0055; border: 1px solid #ff0055; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.8rem; }
        .btn-logout:hover { background: #ff0055; color: #fff; }
        .hidden { display: none !important; }

        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        @keyframes glitch { 0%, 100% { text-shadow: 2px 0 #00f3ff, -2px 0 #bd00ff; } 50% { text-shadow: -2px 0 #00f3ff, 2px 0 #bd00ff; } }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>

    <div class="ai-container">
        <h1 class="title">FANAIgenz</h1>
        <p class="subtitle">Neural Network System Online</p>
        
       <div class="auth-container" id="login-area">
            <div id="g_id_onload"
                 data-client_id="1098689643267-hrlj7u8ciq302s795620b7cuqnf8vev2.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-theme="dark" data-size="large"></div>
        </div>

        <div class="user-profile" id="user-area">
            <div class="user-info">
                <img src="" id="user-img" class="user-avatar" alt="Avatar">
                <span id="user-name">User</span>
            </div>
            <button class="btn-logout" onclick="logout()">Disconnect</button>
        </div>
        
        <input type="text" id="ai-input" class="input-box" placeholder="Silahkan login dahulu..." disabled>
        <button class="btn-generate" id="btn-submit" onclick="generateAI()" disabled>Inisiasi Proses</button>

        <div class="response-box" id="ai-response">
            <span id="typewriter"></span>
        </div>
    </div>

    <script>
        // --- LOGIK AUTH & INTERAKSI API ---
        let userToken = null;

        // Callback setelah user berhasil login lewat Google
        function handleCredentialResponse(response) {
            userToken = response.credential;
            
            // Decode JWT Token kasaran untuk ambil info profil di frontend
            const base64Url = userToken.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const payload = JSON.parse(window.atob(base64));

            // Update UI Profil
            document.getElementById('user-img').src = payload.picture;
            document.getElementById('user-name').innerText = payload.name;
            
            document.getElementById('login-area').classList.add('hidden');
            document.getElementById('user-area').style.display = 'flex';
            
            // Aktifkan Input Form
            document.getElementById('ai-input').disabled = false;
            document.getElementById('ai-input').placeholder = "Masukkan prompt kamu di sini...";
            document.getElementById('btn-submit').disabled = false;
        }

        function logout() {
            userToken = null;
            document.getElementById('login-area').classList.remove('hidden');
            document.getElementById('user-area').style.display = 'none';
            document.getElementById('ai-input').disabled = true;
            document.getElementById('ai-input').value = '';
            document.getElementById('ai-input').placeholder = "Silahkan login dahulu...";
            document.getElementById('btn-submit').disabled = true;
            document.getElementById('ai-response').style.display = 'none';
        }

        async function generateAI() {
            const input = document.getElementById('ai-input').value;
            const responseBox = document.getElementById('ai-response');
            const typeWriterElement = document.getElementById('typewriter');
            
            if (!input.trim() || !userToken) return;

            responseBox.style.display = "block";
            typeWriterElement.innerHTML = "[FANAIgenz]: Menghubungkan ke core AI...";

            try {
                // Panggil Serverless Function di Vercel
                const response = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: input, token: userToken })
                });

                const data = await response.json();
                
                if(data.error) {
                    typeWriterElement.innerHTML = `[ERROR]: ${data.error}`;
                    return;
                }

                // Efek Ketik respons dari Gemini
                typeWriterElement.innerHTML = "";
                let aiText = data.reply;
                let i = 0;
                function typeWriter() {
                    if (i < aiText.length) {
                        typeWriterElement.innerHTML += aiText.charAt(i);
                        i++;
                        setTimeout(typeWriter, 20);
                    }
                }
                typeWriter();

            } catch (err) {
                typeWriterElement.innerHTML = "[ERROR]: Gagal terhubung ke server.";
            }
            document.getElementById('ai-input').value = '';
        }

        // --- KODE ANIMASI CANVAS PARTIKEL (Sama seperti sebelumnya) ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particlesArray = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1; this.speedX = (Math.random() * 2) - 1; this.speedY = (Math.random() * 2) - 1;
                this.color = Math.random() > 0.5 ? '#00f3ff' : '#bd00ff';
            }
            update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > canvas.width) this.speedX *= -1; if (this.y < 0 || this.y > canvas.height) this.speedY *= -1; }
            draw() { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        function init() { for (let i = 0; i < 70; i++) particlesArray.push(new Particle()); }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update(); particlesArray[i].draw();
                for (let j = i; j < particlesArray.length; j++) {
                    const dx = particlesArray[i].x - particlesArray[j].x; const dy = particlesArray[i].y - particlesArray[j].y;
                    if (Math.sqrt(dx*dx + dy*dy) < 100) {
                        ctx.beginPath(); ctx.strokeStyle = 'rgba(0,243,255,0.1)'; ctx.lineWidth = 0.5;
                        ctx.moveTo(particlesArray[i].x, particlesArray[i].y); ctx.lineTo(particlesArray[j].x, particlesArray[j].y); ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        init(); animate();
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; particlesArray = []; init(); });
    </script>
</body>
</html>
